<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NE302 STM32N6 ST-LINK connection</title>
  <desc id="desc">Realistic wiring guide: set N6-BOOT to ON, connect N6-STLINK to ST-LINK, then connect ST-LINK to the PC.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#1d4ed8"/></marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #111827; }
      .sub { font-size: 22px; fill: #475569; }
      .label { font-size: 23px; font-weight: 700; fill: #1d4ed8; }
      .small { font-size: 18px; fill: #475569; }
      .mono { font-family: Menlo, Monaco, Consolas, monospace; font-size: 21px; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text class="font title" x="70" y="75">STM32N6 flashing connection</text>
  <text class="font sub" x="70" y="115">Use the real N6-STLINK port on the NE302 interface board.</text>

  <g filter="url(#softShadow)">
    <rect x="70" y="175" width="550" height="430" rx="18" fill="#ffffff"/>
    <image href="/img/neoeyes-ne302-series/hardware-guide/ne302-interface-board-cropped.png" x="90" y="205" width="510" height="353" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <rect x="100" y="620" width="490" height="52" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="font label" x="345" y="654" text-anchor="middle">N6-BOOT  →  ON</text>

  <path d="M600 430 C660 430 670 430 725 430" stroke="#1d4ed8" stroke-width="8" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text class="font label" x="660" y="395" text-anchor="middle">N6-STLINK</text>
  <text class="font small" x="660" y="480" text-anchor="middle">4-pin SWD cable</text>

  <g transform="translate(1920 0) scale(-1 1)" filter="url(#softShadow)">
    <image href="/img/neoeyes-ne302-series/software-guide/st-link-programmer.png" x="705" y="225" width="520" height="416" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text class="font label" x="965" y="675" text-anchor="middle">ST-LINK</text>
  <text class="font small" x="965" y="705" text-anchor="middle">connect the USB cable to the PC</text>

  <path d="M1215 430 H1390" stroke="#1d4ed8" stroke-width="8" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text class="font label" x="1300" y="395" text-anchor="middle">USB</text>
  <g transform="translate(1405 355)" filter="url(#softShadow)">
    <rect width="120" height="150" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
    <rect x="25" y="30" width="70" height="70" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <path d="M40 76 L53 60 L65 70 L80 52" stroke="#1d4ed8" stroke-width="5" fill="none"/>
  </g>
  <text class="font label" x="1465" y="545" text-anchor="middle">PC</text>

  <rect x="1010" y="760" width="470" height="64" rx="14" fill="#111827"/>
  <text class="mono" x="1040" y="800">make flash-&lt;component&gt;   |   make flash</text>
</svg>
